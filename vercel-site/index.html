<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRANTS BOOK</title></head><body><div id="boot" style="font-family:Arial,sans-serif;padding:24px">Загрузка GRANTS BOOK…</div><script>
(async()=>{
  const SOURCE='https://grants-book-kaspi-assistant-mdm6s4i4u-dias10.vercel.app/';
  const SHEET_ID='1dLU5KOi3WBLy3uNEiqGv5rf9ka0OwcEw_RjhDQW3H1E';
  const addon=`
<script>
(()=>{
  const KASPI_SHEET_ID='${SHEET_ID}';
  window.GB_KASPI_ORDER_AMOUNTS=new Map();
  window.GB_KASPI_AMOUNT_READY=false;
  let gbKaspiAmountPromise=null;

  const gbCell=c=>c&&c.v!=null?String(c.v).trim():'';
  const gbMoneyNum=v=>{const n=Number(String(v??'').replace(/\\s/g,'').replace(',','.').replace(/[^0-9.\\-]/g,''));return Number.isFinite(n)?n:null};
  const gbOrderCode=v=>String(v||'').trim().replace(/-1$/,'');
  const gbNormSku=v=>String(v||'').trim().toUpperCase();

  window.__gbKaspiAmountsCb=function(resp){
    try{
      const rows=resp&&resp.table&&Array.isArray(resp.table.rows)?resp.table.rows:[];
      const map=new Map();
      for(const row of rows){
        const c=row.c||[];
        const code=gbOrderCode(gbCell(c[0]));
        const sku=gbNormSku(gbCell(c[1]));
        const total=gbMoneyNum(c[2]&&c[2].v!=null?c[2].v:gbCell(c[2]));
        const qty=Math.max(1,gbMoneyNum(c[3]&&c[3].v!=null?c[3].v:gbCell(c[3]))||1);
        if(!code||total===null||total<0)continue;
        let rec=map.get(code);
        if(!rec){rec={total,items:[]};map.set(code,rec)}
        rec.total=total;
        rec.items.push({sku,qty});
      }
      window.GB_KASPI_ORDER_AMOUNTS=map;
      window.GB_KASPI_AMOUNT_READY=true;
      if(typeof S!=='undefined'&&S.orders&&typeof renderOrders==='function')renderOrders();
    }catch(e){console.error('Kaspi order amounts parse',e)}
  };

  function gbLoadKaspiAmounts(force=false){
    if(gbKaspiAmountPromise&&!force)return gbKaspiAmountPromise;
    gbKaspiAmountPromise=new Promise(resolve=>{
      const old=document.getElementById('gbKaspiAmountsJsonp');if(old)old.remove();
      const s=document.createElement('script');s.id='gbKaspiAmountsJsonp';
      const q='select A,B,D,E where A is not null';
      s.src='https://docs.google.com/spreadsheets/d/'+KASPI_SHEET_ID+'/gviz/tq?sheet='+encodeURIComponent('KASPI_ЗАКАЗЫ')+'&headers=1&tqx='+encodeURIComponent('out:json;responseHandler:__gbKaspiAmountsCb')+'&tq='+encodeURIComponent(q)+'&_='+Date.now();
      s.onload=()=>resolve(true);
      s.onerror=()=>{console.error('Kaspi order amounts load failed');window.GB_KASPI_AMOUNT_READY=true;resolve(false)};
      document.head.appendChild(s);
    });
    return gbKaspiAmountPromise;
  }

  const gbOrigGrouped=grouped;
  grouped=function(){
    const a=gbOrigGrouped();
    if(S.g==='WB')for(const x of a){
      let orderTotals=0,found=0;
      const exactUnitPrices=[];
      const sku=gbNormSku(x.sku);
      for(const code0 of x.orders){
        const code=gbOrderCode(code0);
        const rec=window.GB_KASPI_ORDER_AMOUNTS.get(code);
        if(!rec)continue;
        orderTotals+=rec.total;found++;
        if(rec.items.length===1&&gbNormSku(rec.items[0].sku)===sku){
          const qty=Math.max(1,Number(rec.items[0].qty)||1);
          exactUnitPrices.push(rec.total/qty);
        }
      }
      const unique=[...new Set(exactUnitPrices.map(v=>Math.round(v)))].sort((a,b)=>a-b);
      x.kaspiOrderTotals=orderTotals;
      x.kaspiOrderTotalsFound=found;
      x.kaspiOrderCount=x.orders.size;
      x.kaspiExactPriceCount=exactUnitPrices.length;
      x.kaspiUnitPriceMin=unique.length?unique[0]:null;
      x.kaspiUnitPriceMax=unique.length?unique[unique.length-1]:null;
    }
    return a;
  };

  function gbCustomerPriceCell(x){
    if(x.kaspiExactPriceCount){
      const p=x.kaspiUnitPriceMin===x.kaspiUnitPriceMax?money(x.kaspiUnitPriceMin):money(x.kaspiUnitPriceMin)+' – '+money(x.kaspiUnitPriceMax);
      return '<td class="price"><b>'+p+'</b><div class="muted">Цена из Kaspi · '+num(x.kaspiExactPriceCount)+' заказ.</div></td>';
    }
    return '<td class="price"><b>'+(window.GB_KASPI_AMOUNT_READY?'—':'Загрузка…')+'</b><div class="muted">Цена позиции не определена</div></td>';
  }

  function gbOrderTotalCell(x){
    if(x.kaspiOrderTotalsFound){
      return '<td class="price" title="Точная сумма заказа из кабинета Kaspi. Если в одном заказе несколько товаров, здесь учитывается сумма всего заказа."><b>'+money(x.kaspiOrderTotals)+'</b><div class="muted">Kaspi · '+num(x.kaspiOrderTotalsFound)+'/'+num(x.kaspiOrderCount)+' заказ.</div></td>';
    }
    return '<td class="price"><b>'+(window.GB_KASPI_AMOUNT_READY?'—':'Загрузка…')+'</b><div class="muted">Нет суммы в KASPI_ЗАКАЗЫ</div></td>';
  }

  renderOrders=function(){
    const c=S.orders?.counts||{},wb=S.g==='WB';
    $('#all').textContent=num(c.all);$('#pre').textContent=num(c.preorder);$('#pack').textContent=num(c.packing);$('#trans').textContent=num(c.transfer);$('#ck').textContent=num(c.kurdai);$('#cw').textContent=num(c.wb);$('#ca').textContent=num(c.almaty);
    $('#fresh').textContent='Последнее обновление: '+fmt(S.orders?.generatedAt)+(S.orders?.cached?' · кэш':'');
    $('#orderHead').innerHTML=wb?'<th>Фото</th><th>Товар</th><th>Артикул</th><th>Кол-во</th><th>Заказы</th><th>Цена клиента</th><th>Сумма заказов</th><th>Оптовая цена</th><th>Ссылка WB</th><th>Этапы</th>':'<th>Фото</th><th>Товар</th><th>Артикул</th><th>Кол-во</th><th>Заказы</th><th>Этапы</th>';
    let a=grouped(),q=$('#os').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.sku+' '+x.name+' '+[...x.orders]).toLowerCase().includes(q));
    const cols=wb?10:6;
    $('#ot').innerHTML=a.length?a.map(x=>'<tr><td>'+pic(x)+'</td><td><b>'+esc(x.name)+'</b></td><td class="sku">'+esc(x.sku)+'</td><td><b style="font-size:20px">'+num(x.qty)+'</b></td><td>'+esc([...x.orders].join(', '))+'</td>'+(wb?gbCustomerPriceCell(x)+gbOrderTotalCell(x)+'<td class="price">'+(x.wholesale==null?'—':money(x.wholesale))+'</td><td>'+(x.wbUrl?'<a class="wblink" href="'+esc(x.wbUrl)+'" target="_blank" rel="noopener">Открыть WB</a>':'—')+'</td>':'')+'<td>'+stages(x)+'</td></tr>').join(''):'<tr><td colspan="'+cols+'">Нет заказов</td></tr>';
    if(wb&&!window.GB_KASPI_AMOUNT_READY)gbLoadKaspiAmounts();
  };

  const oldLoadOrders=loadOrders;
  loadOrders=async function(force=0){const r=await oldLoadOrders(force);if(S.g==='WB')gbLoadKaspiAmounts(force===1);return r};
  document.querySelectorAll('#groups button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.g==='WB')gbLoadKaspiAmounts()}));
  gbLoadKaspiAmounts();
})();
<\/script>`;
  try{
    const w=await(await fetch(SOURCE,{cache:'no-store'})).text();
    const m=w.match(/atob\(\"([^\"]+)\"\)/);
    if(!m)throw new Error('source not found');
    const b=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));
    let h=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    h=h.replace(/v13\.4\.12/g,'v13.4.15');
    h=h.includes('</body>')?h.replace('</body>',addon+'</body>'):h+addon;
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<pre style="padding:20px">Ошибка загрузки GRANTS BOOK: '+String(e)+'</pre>'}
})();
</script></body></html>
