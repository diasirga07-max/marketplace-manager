<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRANTS BOOK</title></head><body><div style="font-family:Arial,sans-serif;padding:24px">Загрузка GRANTS BOOK…</div><script>
(async()=>{
  const SOURCE='https://raw.githubusercontent.com/diasirga07-max/marketplace-manager/7283c5999a0a8bd911c2eea1313019e95b0aa56b/vercel-site/index.html';
  const exportAddon=`
  const GB_EXPORT_SHEET_ID='1543WyOY5gsP3i3rcxcmp1dtxYHy6uPUtdFj8Xs58Cr4';
  const GB_EXPORT_GIDS={'Курдай':2120001010,'WB':2120001011,'Алматы':2120001012};
  function gbEnsureGoogleExportButton(){
    const fresh=document.getElementById('fresh');
    if(!fresh||typeof S==='undefined')return;
    const host=fresh.parentElement;if(!host)return;
    let a=document.getElementById('gbGoogleExcel');
    if(!a){a=document.createElement('a');a.id='gbGoogleExcel';a.className='btn alt';a.target='_blank';a.rel='noopener';a.style.textDecoration='none';a.textContent='↗ Google Excel';host.appendChild(a)}
    const gid=GB_EXPORT_GIDS[S.g]||GB_EXPORT_GIDS['Алматы'];
    a.href='https://docs.google.com/spreadsheets/d/'+GB_EXPORT_SHEET_ID+'/edit#gid='+gid;
    a.title='Открыть отдельный файл выгрузки '+String(S.g||'')+' с фотографиями';
  }
  const gbRenderOrdersExport=renderOrders;
  renderOrders=function(){const r=gbRenderOrdersExport();gbEnsureGoogleExportButton();return r};
  document.querySelectorAll('#groups button').forEach(b=>b.addEventListener('click',()=>setTimeout(gbEnsureGoogleExportButton,0)));
  gbEnsureGoogleExportButton();
`;
  const priceEditorAddon=`
  function gbLoadPriceEditor(){
    if(window.GB_PRICE_EDITOR_LOADED||document.getElementById('gbPriceEditorLoader'))return;
    const loader=document.createElement('script');
    loader.id='gbPriceEditorLoader';
    loader.type='text/javascript';
    document.body.appendChild(loader);
    fetch('https://raw.githubusercontent.com/diasirga07-max/marketplace-manager/main/public/gb-price-editor.js?v=13420',{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error('price editor '+r.status);return r.text()})
      .then(code=>{loader.textContent=code})
      .catch(e=>{console.error('Kaspi price editor load failed',e);loader.remove()});
  }
  gbLoadPriceEditor();
`;
  try{
    let h=await(await fetch(SOURCE,{cache:'no-store'})).text();
    if(!h.includes('gbScannerResponsive'))throw new Error('base build not ready');
    const marker='  gbLoadKaspiAmounts();';
    if(!h.includes(marker))throw new Error('addon injection point not found');
    h=h.replace(marker,exportAddon+priceEditorAddon+marker);
    h=h.replaceAll('v13.4.17','v13.4.20');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<pre style="padding:20px">Ошибка загрузки GRANTS BOOK: '+String(e)+'</pre>'}
})();
</script></body></html>
