name: Refresh complete product photo map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate complete map and overlay live GRANTS BOOK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, urllib.parse, urllib.request
          from pathlib import Path

          paths=[f'public/gb-photo-map-{i}.pack' for i in range(8)]
          raw=''.join(Path(p).read_text(encoding='utf-8').strip() for p in paths)
          photos=json.loads(gzip.decompress(base64.b64decode(raw,validate=True)).decode('utf-8'))
          photos={str(k).strip().upper():str(v).strip() for k,v in photos.items() if str(k).strip() and str(v).strip().startswith('https://')}
          print('existing_photo_count=',len(photos),'packed_length=',len(raw),'mod4=',len(raw)%4)
          if len(photos) < 5800:
              raise SystemExit(f'Existing complete photo map is too small: {len(photos)}')

          SHEET_ID='1dLU5KOi3WBLy3uNEiqGv5rf9ka0OwcEw_RjhDQW3H1E'
          params=urllib.parse.urlencode({
              'sheet':'Прайс KASPI',
              'headers':'1',
              'tqx':'out:json',
              'tq':'select A,AD where A is not null',
              '_':'1788606000000'
          })
          url=f'https://docs.google.com/spreadsheets/d/{SHEET_ID}/gviz/tq?{params}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              text=r.read().decode('utf-8')
          lo=text.find('{'); hi=text.rfind('}')
          if lo<0 or hi<=lo:
              raise SystemExit('Invalid Google Sheets response')
          obj=json.loads(text[lo:hi+1])
          if obj.get('status')=='error':
              raise SystemExit('Google Sheets error: '+json.dumps(obj.get('errors'),ensure_ascii=False))
          live={}
          for row in (obj.get('table') or {}).get('rows') or []:
              cells=row.get('c') or []
              if len(cells)<2 or not cells[0] or not cells[1]:
                  continue
              sku=str(cells[0].get('v') or cells[0].get('f') or '').strip().upper()
              photo=str(cells[1].get('v') or cells[1].get('f') or '').strip()
              if sku and photo.startswith('https://'):
                  live[sku]=photo
          print('live_photo_count=',len(live))
          photos.update(live)

          required=['KITAPENT00088','KITAPENT00092','KITAPENT00096','KITAPENT00097','KITAPENT5555554','ORDABAZAR005','OZ194234763','SHOLPAN0013','SHYN006','8AND80006','8AND80011','8AND800120','8AND800127','8AND800298']
          missing=[s for s in required if not photos.get(s,'').startswith('https://')]
          if missing:
              raise SystemExit('Required photos missing: '+','.join(missing))
          if len(photos)<5800:
              raise SystemExit(f'Final photo map is too small: {len(photos)}')

          payload=json.dumps(photos,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          packed=base64.b64encode(gzip.compress(payload,compresslevel=9)).decode('ascii')
          cuts=[(len(packed)*i)//8 for i in range(9)]
          for i,p in enumerate(paths):
              Path(p).write_text(packed[cuts[i]:cuts[i+1]],encoding='utf-8')

          verify=''.join(Path(p).read_text(encoding='utf-8') for p in paths)
          check=json.loads(gzip.decompress(base64.b64decode(verify,validate=True)).decode('utf-8'))
          if check != photos:
              raise SystemExit('Round-trip verification failed')
          print('final_photo_count=',len(check),'final_packed_length=',len(packed),'mod4=',len(packed)%4)
          print('required_ok=',','.join(required))
          PY

      - name: Commit refreshed map
        shell: bash
        run: |
          set -euo pipefail
          git add public/gb-photo-map-0.pack public/gb-photo-map-1.pack public/gb-photo-map-2.pack public/gb-photo-map-3.pack public/gb-photo-map-4.pack public/gb-photo-map-5.pack public/gb-photo-map-6.pack public/gb-photo-map-7.pack
          if git diff --cached --quiet; then
            echo 'No map changes'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Refresh complete product photo map from live GRANTS BOOK'
          git push origin HEAD:main
