name: Build complete product photo map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge valid current map with historical Kaspi fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, lzma, subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          # Last fully decodable current map. It contains the live/WB layer.
          BASE='7cf4a7ab5362b9ed05a44b89cac362fc3be99d47'
          map_paths=[f'public/gb-photo-map-{i}.pack' for i in range(8)]
          fallback_paths=[f'public/photo-fallback-xz-{i}.part' for i in range(5)]

          raw=''.join(subprocess.check_output(['git','show',f'{BASE}:{p}'],text=True).strip() for p in map_paths)
          base=json.loads(gzip.decompress(base64.b64decode(raw,validate=True)).decode('utf-8'))
          photos={str(k).strip().upper():str(v).strip() for k,v in base.items() if str(k).strip() and str(v).strip().startswith('https://')}
          if len(photos)!=4234:
              raise SystemExit(f'Unexpected valid base size: {len(photos)}')

          fb64=''.join(Path(p).read_text(encoding='utf-8').strip() for p in fallback_paths)
          fallback=json.loads(lzma.decompress(base64.b64decode(fb64,validate=True)).decode('utf-8'))
          fallback={str(k).strip().upper():str(v).strip() for k,v in fallback.items() if str(k).strip() and str(v).strip().startswith('https://')}
          if len(fallback)!=1591:
              raise SystemExit(f'Unexpected historical fallback size: {len(fallback)}')

          # Priority: current/live map first; historical URLs fill only missing SKUs.
          for sku,url in fallback.items():
              photos.setdefault(sku,url)

          def trusted(url):
              try:
                  p=urlparse(url); host=(p.hostname or '').lower()
                  return p.scheme=='https' and (host=='resources.cdn-kaspi.kz' or host.endswith('.wbbasket.ru'))
              except Exception:
                  return False

          bad=[sku for sku,url in photos.items() if not trusted(url)]
          if bad:
              raise SystemExit('Untrusted photo URLs: '+','.join(bad[:20]))
          if len(photos)!=5803:
              raise SystemExit(f'Expected 5803 unique photos, got {len(photos)}')

          samples=[
            'KITAPENT00022','KITAPENT00025','KITAPENT00031','KITAPENT00033','KITAPENT00038',
            'KITAPENT00051','KITAPENT00064','KITAPENT00065','KITAPENT00086','KITAPENT00088',
            'KITAPENT00092','KITAPENT00096','KITAPENT00097','ORDABAZAR005','OZ194234763',
            'SHOLPAN0013','SHYN006','8AND80006','8AND80011','8AND800120','8AND800127','8AND800298'
          ]
          missing=[sku for sku in samples if not photos.get(sku)]
          if missing:
              raise SystemExit('Missing validation SKUs: '+','.join(missing))

          # Deterministic and atomic rebuild. Never patch an individual Base64 chunk.
          payload=json.dumps(photos,ensure_ascii=False,separators=(',',':'),sort_keys=True).encode('utf-8')
          packed=base64.b64encode(gzip.compress(payload,compresslevel=9,mtime=0)).decode('ascii')
          cuts=[(len(packed)*i)//8 for i in range(9)]
          for i,p in enumerate(map_paths):
              Path(p).write_text(packed[cuts[i]:cuts[i+1]],encoding='utf-8')

          verify=''.join(Path(p).read_text(encoding='utf-8') for p in map_paths)
          decoded=json.loads(gzip.decompress(base64.b64decode(verify,validate=True)).decode('utf-8'))
          if decoded != dict(sorted(photos.items())):
              raise SystemExit('Round-trip verification failed')
          print('PHOTO_MAP_OK count=',len(decoded),'packed=',len(verify),'mod4=',len(verify)%4)
          print('FALLBACK_OK count=',len(fallback))
          print('SAMPLES_OK',','.join(samples))
          PY

      - name: Commit all eight map chunks together
        shell: bash
        run: |
          set -euo pipefail
          git add public/gb-photo-map-0.pack public/gb-photo-map-1.pack public/gb-photo-map-2.pack public/gb-photo-map-3.pack public/gb-photo-map-4.pack public/gb-photo-map-5.pack public/gb-photo-map-6.pack public/gb-photo-map-7.pack
          if git diff --cached --quiet; then
            echo 'Photo map already complete'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Restore complete 5803-product photo map'
          git push origin HEAD:main
