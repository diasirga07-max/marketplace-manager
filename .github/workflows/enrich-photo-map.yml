name: Enrich product photo map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve missing Kaspi product images
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, csv, gzip, html, io, json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path

          SHEET_ID = '1dLU5KOi3WBLy3uNEiqGv5rf9ka0OwcEw_RjhDQW3H1E'
          SHEET_NAME = 'Прайс KASPI'
          chunks = [Path(f'public/gb-photo-map-{i}.pack') for i in range(8)]
          raw_b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          photo_map = json.loads(gzip.decompress(base64.b64decode(raw_b64)).decode('utf-8'))
          print('Existing photo map:', len(photo_map))

          csv_url = (
              f'https://docs.google.com/spreadsheets/d/{SHEET_ID}/gviz/tq?'
              + urllib.parse.urlencode({'tqx':'out:csv','sheet':SHEET_NAME})
          )
          req = urllib.request.Request(csv_url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode('utf-8-sig', errors='replace')
          if '<html' in body[:500].lower() or 'Артикул' not in body[:10000]:
              raise RuntimeError('Live Google Sheet CSV is not publicly readable')
          rows = list(csv.reader(io.StringIO(body)))
          print('Live sheet rows:', len(rows))

          def norm(s):
              return re.sub(r'\s+', '', str(s or '').strip().lower())

          def extract_image(text):
              if not text:
                  return ''
              text = html.unescape(text).replace('\\/','/').replace('\\u002F','/').replace('\\u002f','/')
              pats = [
                  r'https://resources\.cdn-kaspi\.kz/[^"\'<>\s\\]+',
                  r'https://cdn-kaspi\.kz/[^"\'<>\s\\]+'
              ]
              candidates=[]
              for pat in pats:
                  candidates += re.findall(pat, text, flags=re.I)
              cleaned=[]
              for u in candidates:
                  u=u.rstrip('),.;]')
                  if re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',u,re.I):
                      cleaned.append(u)
              if not cleaned:
                  return ''
              # Prefer actual gallery/product assets over logos/icons.
              cleaned.sort(key=lambda u: (('gallery' not in u and '/img/m/p/' not in u), len(u)))
              return cleaned[0]

          def fetch_text(url):
              headers={
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  'Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8',
                  'Referer':'https://kaspi.kz/shop/'
              }
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode('utf-8', errors='replace')

          missing=[]
          for row in rows[1:]:
              if len(row) < 18: continue
              sku=norm(row[0])
              kaspi=(row[17] or '').strip()
              if not sku or not kaspi.startswith('https://kaspi.kz/'):
                  continue
              if not photo_map.get(sku):
                  missing.append((sku,kaspi))
          print('Missing with Kaspi link:', len(missing))

          found=0; failed=[]
          for idx,(sku,url) in enumerate(missing,1):
              image=''
              try:
                  text=fetch_text(url)
                  image=extract_image(text)
              except Exception as e:
                  print('direct failed', sku, type(e).__name__, str(e)[:120])
              if not image:
                  # Reader fallback often succeeds when storefront blocks ordinary datacenter requests.
                  try:
                      reader='https://r.jina.ai/http://' + url.removeprefix('https://')
                      text=fetch_text(reader)
                      image=extract_image(text)
                  except Exception as e:
                      print('reader failed', sku, type(e).__name__, str(e)[:120])
              if image:
                  photo_map[sku]=image
                  found += 1
                  print(f'[{idx}/{len(missing)}] OK {sku} -> {image[:100]}')
              else:
                  failed.append((sku,url))
                  print(f'[{idx}/{len(missing)}] NO_IMAGE {sku}')
              time.sleep(0.08)

          print('Resolved:', found, 'Failed:', len(failed))
          if failed:
              Path('public/photo-map-unresolved.json').write_text(json.dumps(failed, ensure_ascii=False, indent=2), encoding='utf-8')
          packed=base64.b64encode(gzip.compress(json.dumps(photo_map, ensure_ascii=False, separators=(',',':')).encode('utf-8'), compresslevel=9)).decode('ascii')
          n=len(chunks); step=(len(packed)+n-1)//n
          for i,p in enumerate(chunks):
              p.write_text(packed[i*step:(i+1)*step], encoding='utf-8')
          Path('public/photo-map-meta.json').write_text(json.dumps({'count':len(photo_map),'resolved_now':found,'failed_now':len(failed)}, ensure_ascii=False, indent=2),encoding='utf-8')
          PY

      - name: Commit enriched photo map
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/gb-photo-map-*.pack public/photo-map-meta.json public/photo-map-unresolved.json 2>/dev/null || true
          git commit -m 'Update product photos from current Kaspi catalog'
          git push origin HEAD:main
