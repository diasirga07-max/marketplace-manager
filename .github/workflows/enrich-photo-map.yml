name: Restore product photo map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last verified complete map
        shell: bash
        run: |
          set -euo pipefail
          GOOD_COMMIT='476f0b579f3c7d49def89a7bafafc0d73229e016'
          for i in 0 1 2 3 4 5 6 7; do
            git show "${GOOD_COMMIT}:public/gb-photo-map-${i}.pack" > "public/gb-photo-map-${i}.pack"
          done

      - name: Verify map and required product photos
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          raw=''.join(Path(f'public/gb-photo-map-{i}.pack').read_text(encoding='utf-8').strip() for i in range(8))
          print('packed_length=',len(raw),'mod4=',len(raw)%4)
          data=json.loads(gzip.decompress(base64.b64decode(raw)).decode('utf-8'))
          print('photo_count=',len(data))
          required=['8and80006','8and80011','8and800120','8and800127','8and800298','8and850000']
          for sku in required:
              url=data.get(sku)
              if not url or not url.startswith('https://'):
                  raise SystemExit(f'Missing required photo: {sku}')
              print(sku,'->',url)
          if len(data) < 5700:
              raise SystemExit(f'Photo map unexpectedly small: {len(data)}')
          PY

      - name: Commit repaired map
        shell: bash
        run: |
          git add public/gb-photo-map-0.pack public/gb-photo-map-1.pack public/gb-photo-map-2.pack public/gb-photo-map-3.pack public/gb-photo-map-4.pack public/gb-photo-map-5.pack public/gb-photo-map-6.pack public/gb-photo-map-7.pack
          if git diff --cached --quiet; then
            echo 'Photo map already matches verified version'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Restore verified complete product photo map'
          git push origin HEAD:main
