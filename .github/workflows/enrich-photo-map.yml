name: Repair and validate product photo map

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/gb-photo-map-*.pack'
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted chunk and validate full map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          from urllib.parse import urlparse

          paths=[Path(f'public/gb-photo-map-{i}.pack') for i in range(8)]
          missing=[str(p) for p in paths if not p.exists()]
          if missing:
              raise SystemExit('Missing photo-map chunks: '+','.join(missing))

          parts=[p.read_text(encoding='utf-8').strip() for p in paths]
          target_chunk5_sha='3572b5d742593aaed216d05fed29ca5d551d291b'
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def git_blob_sha(s):
              raw=s.encode('utf-8')
              return hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()

          # Known corruption: exactly one Base64 symbol was lost from chunk 5.
          # Search the ENTIRE chunk, not a guessed window. Accept a repair only
          # when it reproduces the independently verified Git blob SHA.
          if git_blob_sha(parts[5]) != target_chunk5_sha:
              cur=parts[5]
              if len(cur) != 13085:
                  raise SystemExit(f'Unexpected chunk 5 length: {len(cur)}; expected 13085 before repair')

              found=None
              for pos in range(len(cur)+1):
                  prefix=cur[:pos]
                  suffix=cur[pos:]
                  for ch in alphabet:
                      candidate=prefix+ch+suffix
                      if git_blob_sha(candidate)==target_chunk5_sha:
                          found=(pos,ch,candidate)
                          break
                  if found:
                      break

              if not found:
                  raise SystemExit('Unable to reconstruct the missing Base64 symbol in chunk 5')

              pos,ch,candidate=found
              parts[5]=candidate
              paths[5].write_text(candidate,encoding='utf-8')
              print(f'REPAIRED chunk=5 position={pos} symbol={ch!r} sha={git_blob_sha(candidate)}')

          raw=''.join(parts)
          if len(raw)%4:
              raise SystemExit(f'Invalid Base64 length: {len(raw)} mod4={len(raw)%4}')

          try:
              packed=base64.b64decode(raw,validate=True)
              photos=json.loads(gzip.decompress(packed).decode('utf-8'))
          except Exception as e:
              raise SystemExit(f'Photo map decode failed: {type(e).__name__}: {e}')

          if not isinstance(photos,dict):
              raise SystemExit('Photo map root must be an object')
          if len(photos) != 5803:
              raise SystemExit(f'Unexpected photo count: {len(photos)}; expected 5803')

          bad_keys=[str(k) for k in photos if str(k) != str(k).strip().upper()]
          if bad_keys:
              raise SystemExit('Non-normalized SKU examples: '+','.join(bad_keys[:10]))

          def trusted(url):
              try:
                  p=urlparse(str(url))
                  host=(p.hostname or '').lower()
                  return p.scheme=='https' and (host=='resources.cdn-kaspi.kz' or host.endswith('.wbbasket.ru'))
              except Exception:
                  return False

          bad_urls=[str(k) for k,v in photos.items() if not trusted(v)]
          if bad_urls:
              raise SystemExit('Untrusted photo URL examples: '+','.join(bad_urls[:10]))

          # Cover different SKU families, not only products from screenshots.
          samples=[
            'KITAPENT00022','KITAPENT00025','KITAPENT00031','KITAPENT00033','KITAPENT00038',
            'KITAPENT00051','KITAPENT00064','KITAPENT00065','KITAPENT00086','KITAPENT00088',
            'KITAPENT00092','KITAPENT00096','KITAPENT00097','ORDABAZAR005','OZ194234763',
            'SHOLPAN0013','SHYN006','8AND80006','8AND80011','8AND800120','8AND800127','8AND800298'
          ]
          missing_samples=[s for s in samples if not photos.get(s)]
          if missing_samples:
              raise SystemExit('Missing validation SKUs: '+','.join(missing_samples))

          print('VALID photo_count=',len(photos),'packed_length=',len(raw),'chunk5_sha=',git_blob_sha(parts[5]))
          PY

      - name: Commit repaired photo map
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/gb-photo-map-5.pack; then
            echo 'Photo map already valid; no repair commit needed'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/gb-photo-map-5.pack
          git commit -m 'Repair corrupted product photo map chunk'
          git push origin HEAD:main
