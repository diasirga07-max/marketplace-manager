name: Repair product photo map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find a valid historical map, normalize SKU keys and rebuild all 8 parts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, subprocess
          from pathlib import Path

          paths=[f'public/gb-photo-map-{i}.pack' for i in range(8)]
          commits=subprocess.check_output(['git','rev-list','--all','--',*paths], text=True).splitlines()

          def show(commit, path):
              return subprocess.check_output(['git','show',f'{commit}:{path}'], text=True, stderr=subprocess.DEVNULL)

          candidates=[]
          for pos, commit in enumerate(commits):
              try:
                  raw=''.join(show(commit,p).strip() for p in paths)
              except subprocess.CalledProcessError:
                  continue
              if len(raw) % 4:
                  continue
              try:
                  decoded=base64.b64decode(raw, validate=True)
                  data=json.loads(gzip.decompress(decoded).decode('utf-8'))
              except Exception:
                  continue
              if not isinstance(data, dict) or len(data) < 5000:
                  continue
              candidates.append((len(data), -pos, commit, data))

          if not candidates:
              raise SystemExit('No valid historical photo map with at least 5000 products was found')

          candidates.sort(reverse=True, key=lambda x:(x[0],x[1]))
          count, _, commit, data=candidates[0]
          print('selected_commit=', commit, 'historical_count=', count)

          # The frontend always looks up normalized uppercase SKU values.
          normalized={}
          for k,v in data.items():
              key=str(k or '').strip().upper()
              url=str(v or '').strip()
              if key and url.startswith('https://'):
                  normalized[key]=url

          # Current Kaspi CDN URLs verified in GRANTS BOOK / Прайс KASPI.
          overlay={
            '8AND80006':'https://resources.cdn-kaspi.kz/img/m/p/p66/p7f/134215747.png?format=gallery-large',
            '8AND80011':'https://resources.cdn-kaspi.kz/img/m/p/p7d/pfb/132827188.png?format=gallery-large',
            '8AND800120':'https://resources.cdn-kaspi.kz/img/m/p/pa7/pcb/135102778.png?format=gallery-large',
            '8AND800121':'https://resources.cdn-kaspi.kz/img/m/p/pb7/pe0/134796745.png?format=gallery-large',
            '8AND800122':'https://resources.cdn-kaspi.kz/img/m/p/pa2/pdd/134796752.png?format=gallery-large',
            '8AND800123':'https://resources.cdn-kaspi.kz/img/m/p/p46/pac/135100063.png?format=gallery-large',
            '8AND800124':'https://resources.cdn-kaspi.kz/img/m/p/p7f/pe0/134796747.png?format=gallery-large',
            '8AND800125':'https://resources.cdn-kaspi.kz/img/m/p/pf9/pdc/134796758.png?format=gallery-large',
            '8AND800126':'https://resources.cdn-kaspi.kz/img/m/p/pb8/p85/135099088.png?format=gallery-large',
            '8AND800127':'https://resources.cdn-kaspi.kz/img/m/p/p71/pda/134796760.png?format=gallery-large',
            '8AND800230':'https://resources.cdn-kaspi.kz/img/m/p/p18/pd5/134742438.png?format=gallery-large',
            '8AND800231':'https://resources.cdn-kaspi.kz/img/m/p/pd8/pd7/134742442.png?format=gallery-large',
            '8AND800232':'https://resources.cdn-kaspi.kz/img/m/p/p65/pd8/134742447.png?format=gallery-large',
            '8AND800233':'https://resources.cdn-kaspi.kz/img/m/p/p0a/pdb/134742450.png?format=gallery-large',
            '8AND800234':'https://resources.cdn-kaspi.kz/img/m/p/peb/pdb/134742458.png?format=gallery-large',
            '8AND800235':'https://resources.cdn-kaspi.kz/img/m/p/pbd/p53/135097249.png?format=gallery-large',
            '8AND800236':'https://resources.cdn-kaspi.kz/img/m/p/p10/pea/135095925.png?format=gallery-large',
            '8AND800290':'https://resources.cdn-kaspi.kz/img/m/p/pfe/pf2/132832868.png?format=gallery-large',
            '8AND800291':'https://resources.cdn-kaspi.kz/img/m/p/pba/pdc/133128954.png?format=gallery-large',
            '8AND800292':'https://resources.cdn-kaspi.kz/img/m/p/p30/p7e/134191215.png?format=gallery-large',
            '8AND800294':'https://resources.cdn-kaspi.kz/img/m/p/p07/pef/132832853.png?format=gallery-large',
            '8AND800298':'https://resources.cdn-kaspi.kz/img/m/p/pa9/p91/132975254.png?format=gallery-large'
          }
          normalized.update(overlay)

          payload=json.dumps(normalized, ensure_ascii=False, separators=(',',':')).encode('utf-8')
          packed=base64.b64encode(gzip.compress(payload, compresslevel=9)).decode('ascii')
          # Split deterministically into 8 text files; concatenation must exactly reproduce packed.
          n=len(packed)
          cuts=[(n*i)//8 for i in range(9)]
          for i,p in enumerate(paths):
              Path(p).write_text(packed[cuts[i]:cuts[i+1]], encoding='utf-8')

          verify=''.join(Path(p).read_text(encoding='utf-8') for p in paths)
          check=json.loads(gzip.decompress(base64.b64decode(verify, validate=True)).decode('utf-8'))
          if check != normalized:
              raise SystemExit('Round-trip verification failed')
          for sku,url in overlay.items():
              if check.get(sku) != url:
                  raise SystemExit(f'Missing current product photo after rebuild: {sku}')
          if len(check) < 5000:
              raise SystemExit(f'Photo map unexpectedly small after rebuild: {len(check)}')
          print('final_photo_count=',len(check),'packed_length=',len(packed),'mod4=',len(packed)%4)
          print('sample=', {k:check[k] for k in ['8AND80006','8AND80011','8AND800120','8AND800127','8AND800298']})
          PY

      - name: Commit repaired map
        shell: bash
        run: |
          set -euo pipefail
          git add public/gb-photo-map-0.pack public/gb-photo-map-1.pack public/gb-photo-map-2.pack public/gb-photo-map-3.pack public/gb-photo-map-4.pack public/gb-photo-map-5.pack public/gb-photo-map-6.pack public/gb-photo-map-7.pack
          if git diff --cached --quiet; then
            echo 'Photo map is already repaired'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Rebuild valid normalized product photo map'
          git push origin HEAD:main
