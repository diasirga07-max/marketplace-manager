name: Rebuild product photos from live GRANTS BOOK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-photo-map.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read live Google Sheet and rebuild photo map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, re, urllib.parse, urllib.request
          from pathlib import Path

          SHEET_ID='1dLU5KOi3WBLy3uNEiqGv5rf9ka0OwcEw_RjhDQW3H1E'
          SHEET_NAME='Прайс KASPI'
          query='select A,AD where A is not null'
          params=urllib.parse.urlencode({
              'sheet':SHEET_NAME,
              'headers':'1',
              'tqx':'out:json',
              'tq':query,
              '_':'1788602000000'
          })
          url=f'https://docs.google.com/spreadsheets/d/{SHEET_ID}/gviz/tq?{params}'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=45) as r:
              text=r.read().decode('utf-8')
          print('gviz_status=200 bytes=',len(text))
          lo=text.find('{'); hi=text.rfind('}')
          if lo<0 or hi<=lo:
              raise SystemExit('Google Sheets gviz response is not JSON')
          obj=json.loads(text[lo:hi+1])
          if obj.get('status') == 'error':
              raise SystemExit('Google Sheets gviz error: '+json.dumps(obj.get('errors'),ensure_ascii=False))
          rows=(obj.get('table') or {}).get('rows') or []

          photos={}
          for row in rows:
              cells=row.get('c') or []
              if len(cells)<2 or not cells[0] or not cells[1]:
                  continue
              sku=str(cells[0].get('v') or cells[0].get('f') or '').strip().upper()
              photo=str(cells[1].get('v') or cells[1].get('f') or '').strip()
              if sku and photo.startswith('https://'):
                  photos[sku]=photo

          # Current Kaspi CDN values verified directly in the live price sheet.
          photos.update({
            '8AND80006':'https://resources.cdn-kaspi.kz/img/m/p/p66/p7f/134215747.png?format=gallery-large',
            '8AND80011':'https://resources.cdn-kaspi.kz/img/m/p/p7d/pfb/132827188.png?format=gallery-large',
            '8AND800120':'https://resources.cdn-kaspi.kz/img/m/p/pa7/pcb/135102778.png?format=gallery-large',
            '8AND800121':'https://resources.cdn-kaspi.kz/img/m/p/pb7/pe0/134796745.png?format=gallery-large',
            '8AND800122':'https://resources.cdn-kaspi.kz/img/m/p/pa2/pdd/134796752.png?format=gallery-large',
            '8AND800123':'https://resources.cdn-kaspi.kz/img/m/p/p46/pac/135100063.png?format=gallery-large',
            '8AND800124':'https://resources.cdn-kaspi.kz/img/m/p/p7f/pe0/134796747.png?format=gallery-large',
            '8AND800125':'https://resources.cdn-kaspi.kz/img/m/p/pf9/pdc/134796758.png?format=gallery-large',
            '8AND800126':'https://resources.cdn-kaspi.kz/img/m/p/pb8/p85/135099088.png?format=gallery-large',
            '8AND800127':'https://resources.cdn-kaspi.kz/img/m/p/p71/pda/134796760.png?format=gallery-large',
            '8AND800230':'https://resources.cdn-kaspi.kz/img/m/p/p18/pd5/134742438.png?format=gallery-large',
            '8AND800231':'https://resources.cdn-kaspi.kz/img/m/p/pd8/pd7/134742442.png?format=gallery-large',
            '8AND800232':'https://resources.cdn-kaspi.kz/img/m/p/p65/pd8/134742447.png?format=gallery-large',
            '8AND800233':'https://resources.cdn-kaspi.kz/img/m/p/p0a/pdb/134742450.png?format=gallery-large',
            '8AND800234':'https://resources.cdn-kaspi.kz/img/m/p/peb/pdb/134742458.png?format=gallery-large',
            '8AND800235':'https://resources.cdn-kaspi.kz/img/m/p/pbd/p53/135097249.png?format=gallery-large',
            '8AND800236':'https://resources.cdn-kaspi.kz/img/m/p/p10/pea/135095925.png?format=gallery-large',
            '8AND800290':'https://resources.cdn-kaspi.kz/img/m/p/pfe/pf2/132832868.png?format=gallery-large',
            '8AND800291':'https://resources.cdn-kaspi.kz/img/m/p/pba/pdc/133128954.png?format=gallery-large',
            '8AND800292':'https://resources.cdn-kaspi.kz/img/m/p/p30/p7e/134191215.png?format=gallery-large',
            '8AND800294':'https://resources.cdn-kaspi.kz/img/m/p/p07/pef/132832853.png?format=gallery-large',
            '8AND800298':'https://resources.cdn-kaspi.kz/img/m/p/pa9/p91/132975254.png?format=gallery-large'
          })

          if len(photos) < 1000:
              raise SystemExit(f'Too few live photos returned by Google Sheet: {len(photos)}')

          payload=json.dumps(photos,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          packed=base64.b64encode(gzip.compress(payload,compresslevel=9)).decode('ascii')
          cuts=[(len(packed)*i)//8 for i in range(9)]
          for i in range(8):
              Path(f'public/gb-photo-map-{i}.pack').write_text(packed[cuts[i]:cuts[i+1]],encoding='utf-8')

          verify=''.join(Path(f'public/gb-photo-map-{i}.pack').read_text(encoding='utf-8') for i in range(8))
          restored=json.loads(gzip.decompress(base64.b64decode(verify,validate=True)).decode('utf-8'))
          if restored != photos:
              raise SystemExit('Photo-map round-trip verification failed')
          required=['8AND80006','8AND80011','8AND800120','8AND800127','8AND800298']
          for sku in required:
              if not restored.get(sku,'').startswith('https://'):
                  raise SystemExit('Missing required photo '+sku)
          print('photo_count=',len(restored),'packed_length=',len(packed),'mod4=',len(packed)%4)
          print('required_ok=',','.join(required))
          PY

      - name: Commit live photo map
        shell: bash
        run: |
          set -euo pipefail
          git add public/gb-photo-map-0.pack public/gb-photo-map-1.pack public/gb-photo-map-2.pack public/gb-photo-map-3.pack public/gb-photo-map-4.pack public/gb-photo-map-5.pack public/gb-photo-map-6.pack public/gb-photo-map-7.pack
          if git diff --cached --quiet; then
            echo 'No photo-map changes'
            exit 0
          fi
          git config user.name 'grants-book-photo-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Rebuild product photos from live GRANTS BOOK'
          git push origin HEAD:main
