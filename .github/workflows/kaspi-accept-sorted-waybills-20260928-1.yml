name: Kaspi accept sorted waybills 2026-09-28 batch 1

on:
  push:
    paths:
      - '.github/workflows/kaspi-accept-sorted-waybills-20260928-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: python -m pip install --quiet pypdf requests

      - name: Accept, download and sort waybills by product title
        shell: python
        run: |
          import csv, json, os, re, time, concurrent.futures, zipfile, unicodedata
          from urllib.parse import quote
          import requests
          from pypdf import PdfReader, PdfWriter

          APIS=[
            'https://grants-book-kaspi-assistant-fdowk740o-dias10.vercel.app/api/accept-orders',
            'https://grants-book-kaspi-assistant.vercel.app/api/accept-orders',
            'https://grants-book-kaspi-assistant-898x1ke89-dias10.vercel.app/api/accept-orders',
          ]
          UA='GRANTS-BOOK-sorted-waybills-20260928-1'
          CODES='''1073287410 1072183566 1069255792 1081295656 1084786657 1079927188 1079129277 1088055244 1078677761 1078238533 1087568690 1087040729 1077706719 1086732379 1086655386 1086078728 1076490212 1075801066 1085083013 1074401217 1084416128 1073476484 1072901039 1082104770 1072198928 1069322254 1075196741 1072164880 1070677750 1070576110 1090331807 1090214999 1089845599 1089924250 1089712460 1089707298 1090126597 1089861775'''.split()
          codes=list(dict.fromkeys(CODES))
          OUT='generated/batch-2026-09-28-1-sorted'
          WAY=OUT+'/waybills'
          os.makedirs(WAY,exist_ok=True)
          print('CODES|'+str(len(codes)),flush=True)

          def req_json(url,payload=None,timeout=180):
              headers={'User-Agent':UA}
              r=requests.get(url,headers=headers,timeout=timeout) if payload is None else requests.post(url,json=payload,headers=headers,timeout=timeout)
              try: data=r.json()
              except Exception: data={'raw':r.text[:500]}
              if not r.ok: raise RuntimeError(f'HTTP {r.status_code}: {r.text[:300]}')
              return data

          results={}; pending=list(codes)
          for api_index,api in enumerate(APIS,1):
              if not pending: break
              cur=list(pending); nxt=[]
              for i in range(0,len(cur),10):
                  batch=cur[i:i+10]
                  try:
                      p=req_json(api,{'codes':batch,'numberOfSpace':1,'formWaybill':True})
                      rows=p.get('results') or []
                      by={str(x.get('code') or x.get('rawCode') or '').strip():x for x in rows}
                      print(f'API{api_index}|BATCH|{i//10+1}|rows={len(rows)}',flush=True)
                  except Exception as e:
                      by={}
                      print(f'API{api_index}|BATCH|{i//10+1}|ERROR|{e}',flush=True)
                  for c in batch:
                      x=by.get(c)
                      if x:
                          results[c]=x
                          print('RESULT|'+c+'|'+str(x.get('message') or x.get('error') or ''),flush=True)
                      if not x or not x.get('ok'): nxt.append(c)
                  time.sleep(.8)
              pending=list(dict.fromkeys(nxt))
              print(f'API{api_index}|PENDING|{len(pending)}',flush=True)

          states={}; found={}
          def inspect(c):
              last={}
              for api in APIS:
                  try:
                      o=(req_json(api+'?code='+quote(c)+'&_='+str(int(time.time()*1000)),timeout=30).get('order') or {})
                      last=o
                      if o.get('waybill'): return c,o
                  except Exception as e: last={'error':str(e)}
              return c,last

          for attempt in range(16):
              waiting=[c for c in codes if c not in found]
              if not waiting: break
              with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
                  for c,o in ex.map(inspect,waiting):
                      states[c]=o
                      if o.get('waybill'):
                          found[c]=o['waybill']; print('WAYBILL|'+c+'|READY',flush=True)
              print(f'POLL|{attempt+1}|ready={len(found)}|pending={len(codes)-len(found)}',flush=True)
              if attempt<15 and len(found)<len(codes): time.sleep(6)

          def download(item):
              c,url=item
              try:
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
                  if not r.content.startswith(b'%PDF'): raise RuntimeError('Downloaded content is not PDF')
                  p=WAY+'/'+c+'.pdf'
                  open(p,'wb').write(r.content)
                  return c,p,''
              except Exception as e:return c,'',str(e)

          downloaded={}; download_errors={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for c,p,e in ex.map(download,found.items()):
                  if p: downloaded[c]=p
                  else: download_errors[c]=e

          def product_title(pdf_path):
              try:
                  text='\n'.join((p.extract_text() or '') for p in PdfReader(pdf_path).pages)
              except Exception:
                  return ''
              text=text.replace('\r','\n')
              candidates=[]
              for line in text.splitlines():
                  s=re.sub(r'\s+',' ',line).strip()
                  if '1-' in s:
                      clean=re.sub(r'^.*?\b1-\s*','',s,count=1).strip()
                      if clean: candidates.append(clean)
              if candidates:
                  title=max(candidates,key=len)
              else:
                  m=re.search(r'(?ms)\b1-\s*(.+?)(?:\n|\Z)',text)
                  title=(m.group(1) if m else '').strip()
              title=re.sub(r'(?:\s*\.\s*){3,}\s*\d+\s*шт\.?\s*$','',title,flags=re.I)
              title=re.sub(r'\s+\d+\s*шт\.?\s*$','',title,flags=re.I)
              title=re.sub(r'(?:\s*\.\s*){3,}\s*$','',title)
              title=re.sub(r'\s+',' ',title).strip(' .')
              return title

          rows=[]
          for c in codes:
              p=downloaded.get(c)
              title=product_title(p) if p else ''
              rows.append({'order':c,'title':title,'path':p or ''})
              print('TITLE|'+c+'|'+title,flush=True)

          def key(s):
              s=unicodedata.normalize('NFKD',s or '').casefold().replace('ё','е')
              return re.sub(r'[^0-9a-zа-яәіңғүұқөһ]+',' ',s).strip()

          sorted_rows=sorted([r for r in rows if r['path']], key=lambda r:(key(r['title']),r['order']))

          writer=PdfWriter()
          for r in sorted_rows:
              for page in PdfReader(r['path']).pages: writer.add_page(page)
          merged=OUT+'/Kaspi_waybills_2026-09-28_batch1_SORTED_BY_PRODUCT.pdf'
          if sorted_rows:
              with open(merged,'wb') as f: writer.write(f)

          missing=[c for c in codes if c not in downloaded]
          with open(OUT+'/missing.txt','w',encoding='utf-8') as f: f.write('\n'.join(missing))
          with open(OUT+'/sorted_order.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f); w.writerow(['position','order','product_title'])
              for i,r in enumerate(sorted_rows,1): w.writerow([i,r['order'],r['title']])
          with open(OUT+'/status.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f); w.writerow(['order','product_title','status','state','downloaded','result','error'])
              rowmap={r['order']:r for r in rows}
              for c in codes:
                  o=states.get(c) or {}; rr=rowmap.get(c) or {}; rs=results.get(c) or {}
                  w.writerow([c,rr.get('title',''),o.get('status',''),o.get('state',''),'yes' if c in downloaded else 'no',rs.get('message',''),rs.get('error','') or o.get('error','') or download_errors.get(c,'')])
          with open(OUT+'/result.json','w',encoding='utf-8') as f:
              json.dump({'codes':codes,'sorted':[{'order':r['order'],'title':r['title']} for r in sorted_rows],'states':states,'results':results,'missing':missing},f,ensure_ascii=False,indent=2)

          zipname=OUT+'/kaspi-waybills-20260928-batch1-sorted.zip'
          with zipfile.ZipFile(zipname,'w',zipfile.ZIP_DEFLATED) as z:
              if os.path.exists(merged): z.write(merged,os.path.basename(merged))
              for name in ['sorted_order.csv','status.csv','missing.txt','result.json']:
                  z.write(OUT+'/'+name,name)
              for r in sorted_rows: z.write(r['path'],'waybills/'+os.path.basename(r['path']))
          print('SORTED_ORDER_START')
          for i,r in enumerate(sorted_rows,1): print(f"{i}|{r['order']}|{r['title']}",flush=True)
          print('SORTED_ORDER_END')
          print(f'SUMMARY|total={len(codes)}|pdfs={len(downloaded)}|missing={len(missing)}|sorted={len(sorted_rows)}',flush=True)

      - name: Upload ready sorted waybills
        uses: actions/upload-artifact@v4
        with:
          name: kaspi-waybills-20260928-batch1-sorted
          path: generated/batch-2026-09-28-1-sorted/
          if-no-files-found: error
          retention-days: 3

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/batch-2026-09-28-1-sorted/
          if git diff --cached --quiet; then echo "No result changes"; else
            git commit -m "Store sorted Kaspi waybills batch 2026-09-28-1 [skip ci]"
            git push
          fi
