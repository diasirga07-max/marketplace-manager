name: Deploy GRANTS BOOK dashboard

on:
  push:
    paths:
      - 'vercel-site/**'
      - '.github/workflows/deploy-grants-book-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN secret is not configured in this repository.'
            exit 2
          fi

      - name: Link existing Vercel project
        working-directory: vercel-site
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_Dx3XUvYUtwzMyAED4jd8Cusl","projectId":"prj_FOJarCBy108KtsipqY2kIPCQlDFP"}' > .vercel/project.json

      - name: Deploy production
        working-directory: vercel-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
