name: Sync WB prices to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/wb-sheets-sync.yml'

permissions:
  contents: read

concurrency:
  group: wb-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Refresh WB shard ${{ matrix.part }}/8 via Vercel
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://grants-book-kaspi-assistant.vercel.app/api/wb-sheets-sync-v3'

          for attempt in 1 2 3; do
            echo "Shard ${{ matrix.part }}/8, attempt $attempt/3"
            if response="$(curl --fail --show-error --silent \
              --connect-timeout 10 \
              --max-time 70 \
              "${BASE}?part=${{ matrix.part }}&parts=8&source=github-cron&run=${GITHUB_RUN_ID}&attempt=${attempt}")"; then
              echo "$response"
              if printf '%s' "$response" | grep -q '"ok":true'; then
                echo "Shard ${{ matrix.part }} completed successfully"
                exit 0
              fi
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 6))
            fi
          done

          echo "Shard ${{ matrix.part }} failed after 3 attempts"
          exit 1
