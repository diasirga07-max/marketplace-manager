name: Sync WB prices to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/wb-sheets-sync.yml'

permissions:
  contents: read

concurrency:
  group: wb-sheets-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh all WB shards through Vercel
        shell: bash
        run: |
          set -euo pipefail

          export BASE='https://grants-book-kaspi-assistant.vercel.app/api/wb-sheets-sync-v3'
          export PARTS=64
          export ROWS=6365
          FAILED_FILE="$(mktemp)"
          touch "$FAILED_FILE"

          run_part() {
            part="$1"
            echo "WB part ${part}/${PARTS}"

            for attempt in 1 2 3; do
              echo "part=${part} attempt=${attempt}"
              if response="$(curl --fail --show-error --silent                 --connect-timeout 8                 --max-time 45                 "${BASE}?part=${part}&parts=${PARTS}&rows=${ROWS}&fast=0&source=github-cron&run=${GITHUB_RUN_ID}&attempt=${attempt}")"; then
                echo "${response}"
                if printf '%s' "${response}" | grep -q '"ok":true'; then
                  return 0
                fi
              fi
              sleep $((attempt * 3))
            done

            echo "${part}" >> "${FAILED_FILE}"
            return 0
          }

          export -f run_part
          export FAILED_FILE

          seq 0 63 | xargs -P 4 -I '{}' bash -c 'run_part "$1"' _ '{}'

          if [ -s "$FAILED_FILE" ]; then
            echo "Retrying failed shards serially:"
            sort -nu "$FAILED_FILE"
            cp "$FAILED_FILE" "${FAILED_FILE}.first"
            : > "$FAILED_FILE"

            while read -r part; do
              [ -z "$part" ] && continue
              if response="$(curl --fail --show-error --silent                 --connect-timeout 8                 --max-time 50                 "${BASE}?part=${part}&parts=${PARTS}&rows=${ROWS}&fast=0&source=github-retry&run=${GITHUB_RUN_ID}")"; then
                echo "${response}"
                if printf '%s' "${response}" | grep -q '"ok":true'; then
                  continue
                fi
              fi
              echo "${part}" >> "$FAILED_FILE"
            done < <(sort -nu "${FAILED_FILE}.first")
          fi

          if [ -s "$FAILED_FILE" ]; then
            echo "::error::WB sync incomplete. Failed shards:"
            sort -nu "$FAILED_FILE"
            exit 1
          fi

          echo "WB sync cycle finished: all 64 shards completed"
