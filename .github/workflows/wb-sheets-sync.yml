name: Sync WB prices to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/wb-sheets-sync.yml'

permissions:
  contents: read

concurrency:
  group: wb-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh all WB shards through Vercel
        shell: bash
        run: |
          set -euo pipefail

          export BASE='https://grants-book-kaspi-assistant.vercel.app/api/wb-sheets-sync-v3'
          export PARTS=64

          run_part() {
            part="$1"

            for attempt in 1 2 3; do
              echo "WB part ${part}/${PARTS}, attempt ${attempt}/3"

              if response="$(curl --fail --show-error --silent \
                --connect-timeout 8 \
                --max-time 45 \
                "${BASE}?part=${part}&parts=${PARTS}&fast=1&source=github-cron&run=${GITHUB_RUN_ID}&attempt=${attempt}")"; then
                echo "${response}"
                if printf '%s' "${response}" | grep -q '"ok":true'; then
                  echo "WB part ${part} completed"
                  return 0
                fi
              fi

              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 4))
              fi
            done

            echo "WB part ${part} failed after 3 attempts" >&2
            return 1
          }

          export -f run_part

          # Eight concurrent short Vercel calls. A failed part is isolated and retried
          # without blocking successful parts or overwriting last-known-good prices.
          seq 0 63 | xargs -P 8 -I '{}' bash -c 'run_part "$1"' _ '{}'

          echo "All WB parts completed"
