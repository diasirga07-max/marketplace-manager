name: Sync WB prices to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/wb-sheets-sync.yml'

permissions:
  contents: read

concurrency:
  group: wb-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh all WB shards through Vercel
        shell: bash
        run: |
          set -euo pipefail

          export BASE='https://grants-book-kaspi-assistant.vercel.app/api/wb-sheets-sync-v3'
          export PARTS=32

          # Fixed upper bound avoids a full-column Google Sheets read before every cycle.
          # Current sheet is well below this and empty ranges are harmless.
          export ROWS=6365
          echo "WB scan upper row bound: ${ROWS}"

          run_part() {
            part="$1"
            echo "WB part ${part}/${PARTS}"

            if response="$(curl --fail --show-error --silent               --connect-timeout 8               --max-time 55               "${BASE}?part=${part}&parts=${PARTS}&rows=${ROWS}&fast=0&source=github-cron&run=${GITHUB_RUN_ID}")"; then
              echo "${response}"
              if printf '%s' "${response}" | grep -q '"ok":true'; then
                return 0
              fi
            fi

            echo "::warning::WB part ${part} did not complete; last-known-good values are preserved and the next cycle will retry it"
            return 0
          }

          export -f run_part

          # 32 bounded Google Sheets ranges per cycle. Full Vercel fallback is used
          # because native WB fetch currently returns 403 while impit/curl succeeds.
          seq 0 31 | xargs -P 2 -I '{}' bash -c 'run_part "$1"' _ '{}'

          echo "WB sync cycle finished"
