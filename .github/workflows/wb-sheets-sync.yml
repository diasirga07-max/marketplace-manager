name: Sync WB prices to Google Sheets

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh Wildberries prices in Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 3 \
            --max-time 120 \
            'https://grants-book-kaspi-assistant.vercel.app/api/wb-sheets-sync'
