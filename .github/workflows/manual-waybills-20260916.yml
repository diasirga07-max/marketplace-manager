name: Manual Kaspi waybills 2026-09-16

on:
  push:
    paths:
      - '.github/workflows/manual-waybills-20260916.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate waybills
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          API='https://grants-book-kaspi-assistant.vercel.app/api/accept-orders'
          CODES='''1077131291
          1077100769
