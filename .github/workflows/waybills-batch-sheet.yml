name: Collect Kaspi waybills requested batch

on:
  push:
    paths:
      - '.github/workflows/waybills-batch-sheet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: python -m pip install --quiet pypdf requests

      - name: Wait for Kaspi processing and collect waybills
        shell: python
        run: |
          import csv, json, os, time, concurrent.futures, zipfile
          from urllib.parse import quote
          import requests
          from pypdf import PdfReader, PdfWriter

          API='https://grants-book-kaspi-assistant.vercel.app/api/accept-orders'
          UA='GRANTS-BOOK-waybill-collector-20260918'
          CODES='''1075375731 1069342838 1069340228 1069322663 1069270979 1069252851 1069212463 1069192260 1069185255 1069145833 1069137536 1069083169 1069072292 1078791002 1078715014 1078706306 1064102433 1065562532 1078499299 1078391322 1078304730 1077986231 1077856462 1068004987 1077513912 1077125303 1077020663 1066711514 1066276057 1066240015 1066156912 1066111816 1076416961 1076131143 1076117118 1075762564 1065670893 1065635938 1065572473 1065053894 1075209253 1075190778 1075108762 1074916252 1074476981 1074380520 1074269539 1074247857 1064310834 1064136779 1063938018 1063833888 1063712216 1074129949 1074113993 1073972438 1073861428 1073847447 1073838257 1073828966 1073810054 1073721605 1073493148 1073418144 1073332239 1073191350 1063199873 1062257493 1072894617 1072684365 1072372395 1072159226 1072038885 1071307334 1071062227 1070842412 1070826232 1070567285 1059801167 1070395862 1070334042 1070080838 1069985702 1069921257 1069860391 1069813127 1069755693 1069576196 1069454515 1069258762 1069169130 1069146731 1057720610 1066156954 1065711562 1062662579 1055168337'''.split()
          codes=list(dict.fromkeys(CODES))
          os.makedirs('generated/waybills',exist_ok=True)

          def inspect(c):
              try:
                  r=requests.get(API+'?code='+quote(c)+'&_='+str(int(time.time()*1000)),headers={'User-Agent':UA},timeout=30)
                  r.raise_for_status()
                  return c,(r.json().get('order') or {})
              except Exception as e:
                  return c,{'error':str(e)}

          found={}; states={}
          time.sleep(90)
          for attempt in range(8):
              pending=[c for c in codes if c not in found]
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                  for c,o in ex.map(inspect,pending):
                      states[c]=o
                      if o.get('waybill'): found[c]=o['waybill']
              print(f'POLL|{attempt+1}|waybills={len(found)}|pending={len(codes)-len(found)}',flush=True)
              if attempt<7 and len(found)<len(codes): time.sleep(10)

          def download(item):
              c,url=item
              try:
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
                  r.raise_for_status()
                  data=r.content
                  if not data.startswith(b'%PDF'): raise RuntimeError('Downloaded content is not PDF')
                  p='generated/waybills/'+c+'.pdf'
                  with open(p,'wb') as f: f.write(data)
                  return c,p,''
              except Exception as e: return c,'',str(e)

          downloaded={}; download_errors={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for c,p,e in ex.map(download,found.items()):
                  if p: downloaded[c]=p
                  else: download_errors[c]=e

          writer=PdfWriter(); merged_count=0; merge_errors={}
          for c in codes:
              p=downloaded.get(c)
              if not p: continue
              try:
                  reader=PdfReader(p)
                  for page in reader.pages: writer.add_page(page)
                  merged_count+=1
              except Exception as e: merge_errors[c]=str(e)

          merged='generated/Kaspi_waybills_2026-09-18.pdf'
          if merged_count:
              with open(merged,'wb') as f: writer.write(f)

          missing=[c for c in codes if c not in downloaded]
          with open('generated/missing.txt','w',encoding='utf-8') as f: f.write('\n'.join(missing))
          with open('generated/status.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['order','status','state','preorder','waybill','downloaded','error'])
              for c in codes:
                  o=states.get(c) or {}
                  w.writerow([c,o.get('status',''),o.get('state',''),o.get('preOrder',o.get('preorder','')),found.get(c,''),'yes' if c in downloaded else 'no',o.get('error','') or download_errors.get(c,'')])
          with open('generated/result.json','w',encoding='utf-8') as f:
              json.dump({'codes':codes,'states':states,'waybills':found,'download_errors':download_errors,'merge_errors':merge_errors,'missing':missing},f,ensure_ascii=False,indent=2)

          with zipfile.ZipFile('generated/kaspi-waybills-20260918.zip','w',zipfile.ZIP_DEFLATED) as z:
              if os.path.exists(merged): z.write(merged,os.path.basename(merged))
              z.write('generated/missing.txt','missing.txt')
              z.write('generated/status.csv','status.csv')
              z.write('generated/result.json','result.json')
              for c in codes:
                  p=downloaded.get(c)
                  if p and os.path.exists(p): z.write(p,'waybills/'+os.path.basename(p))
          print(f'SUMMARY|total={len(codes)}|urls={len(found)}|pdfs={len(downloaded)}|missing={len(missing)}',flush=True)

      - name: Save results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Store Kaspi waybill results 2026-09-18 [skip ci]"
            git push
          fi
