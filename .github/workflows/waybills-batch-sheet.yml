name: Generate Kaspi waybills requested batch

on:
  push:
    paths:
      - '.github/workflows/waybills-batch-sheet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: python -m pip install --quiet pypdf requests

      - name: Generate orders and collect official Kaspi waybills
        shell: python
        run: |
          import csv, json, os, time, concurrent.futures, zipfile
          from urllib.parse import quote
          import requests
          from pypdf import PdfReader, PdfWriter

          CURRENT='https://grants-book-kaspi-assistant.vercel.app/api/accept-orders'
          LEGACY1='https://grants-book-kaspi-assistant-cy44812wz-dias10.vercel.app/api/accept-orders'
          LEGACY2='https://grants-book-kaspi-assistant-898x1ke89-dias10.vercel.app/api/accept-orders'
          UA='GRANTS-BOOK-waybill-batch-20260919-1'
          CODES='''1078408025 1070437871 1070119592 1070039788 1079250499 1072677414 1069403752 1069391006 1069361728 1069323465 1069230549 1069202499 1069166937 1068929466 1068923501 1068712406 1068698009 1068659831 1068452698 1078516017 1078104826 1078071069 1078034581 1076195768 1075003940 1074821712 1074691077 1074365465 1074304671 1074270041 1072307742 1071995155 1079990423 1080219709 1070337683 1070668876 1078931068 1078737759 1078397692 1078334999 1077248473 1076806324 1066802823 1066722594 1066161478 1065974295 1076273173 1063755122 1065355130 1074960163 1064777726 1073910388 1073492683 1073418046 1072656066 1072227744 1060687091 1060571061 1060381632 1060473956 1059714683 1058552734 1065638402 1065619499 1079845503 1080312447 1080063532 1079963712 1069136915 1077824455 1076564607 1075360055 1074644831 1071738900 1079684259 1069412860 1080200996 1079832484 1080066379 1079862879 1079814469 1078935515'''.split()
          codes=list(dict.fromkeys(CODES))
          OUT='generated/batch-2026-09-19-1'
          os.makedirs(OUT+'/waybills',exist_ok=True)
          print('CODES|'+str(len(codes)),flush=True)

          def req_json(url,payload=None,timeout=180):
              if payload is None:
                  r=requests.get(url,headers={'User-Agent':UA},timeout=timeout)
              else:
                  r=requests.post(url,json=payload,headers={'User-Agent':UA},timeout=timeout)
              text=r.text
              try: data=r.json()
              except Exception: data={'raw':text[:500]}
              if not r.ok: raise RuntimeError(f'HTTP {r.status_code}: {text[:300]}')
              return data

          def post_batches(base,label,target_codes):
              all_results={}
              for i in range(0,len(target_codes),10):
                  batch=target_codes[i:i+10]
                  try:
                      p=req_json(base,{'codes':batch,'numberOfSpace':1,'formWaybill':True},timeout=180)
                      rows=p.get('results') or []
                      print(label+'|BATCH|'+str(i//10+1)+'|ok|rows='+str(len(rows)),flush=True)
                  except Exception as e:
                      rows=[]
                      print(label+'|BATCH|'+str(i//10+1)+'|ERROR|'+str(e),flush=True)
                  for x in rows:
                      c=str(x.get('code') or x.get('rawCode') or '').strip()
                      if c:
                          all_results[c]=x
                          print(label+'|RESULT|'+c+'|'+str(x.get('message') or x.get('error') or ''),flush=True)
                  time.sleep(.8)
              return all_results

          def inspect(c):
              try:
                  j=req_json(CURRENT+'?code='+quote(c)+'&_='+str(int(time.time()*1000)),timeout=30)
                  return c,(j.get('order') or {})
              except Exception as e:
                  return c,{'error':str(e)}

          def poll(found,states,rounds=12,sleep_s=7):
              for attempt in range(rounds):
                  pending=[c for c in codes if c not in found]
                  if not pending: break
                  with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                      for c,o in ex.map(inspect,pending):
                          states[c]=o
                          if o.get('waybill'):
                              found[c]=o['waybill']
                              print('WAYBILL|'+c+'|READY',flush=True)
                  print('POLL|'+str(attempt+1)+'|ready='+str(len(found))+'|pending='+str(len(codes)-len(found)),flush=True)
                  if attempt<rounds-1 and len(found)<len(codes): time.sleep(sleep_s)

          states={}; found={}; results={}
          results['legacy1']=post_batches(LEGACY1,'LEGACY1',codes)
          poll(found,states,rounds=10,sleep_s=6)

          missing1=[c for c in codes if c not in found and (states.get(c) or {}).get('status') not in ('CANCELLED','COMPLETED','RETURNED')]
          if missing1:
              results['legacy2']=post_batches(LEGACY2,'LEGACY2',missing1)
              poll(found,states,rounds=12,sleep_s=6)

          def download(item):
              c,url=item
              try:
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
                  r.raise_for_status(); data=r.content
                  if not data.startswith(b'%PDF'): raise RuntimeError('Downloaded content is not PDF')
                  p=OUT+'/waybills/'+c+'.pdf'
                  with open(p,'wb') as f: f.write(data)
                  return c,p,''
              except Exception as e: return c,'',str(e)

          downloaded={}; download_errors={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for c,p,e in ex.map(download,found.items()):
                  if p: downloaded[c]=p
                  else: download_errors[c]=e

          writer=PdfWriter(); merged_count=0; merge_errors={}
          for c in codes:
              p=downloaded.get(c)
              if not p: continue
              try:
                  reader=PdfReader(p)
                  for page in reader.pages: writer.add_page(page)
                  merged_count+=1
              except Exception as e: merge_errors[c]=str(e)

          merged=OUT+'/Kaspi_waybills_2026-09-19_batch1.pdf'
          if merged_count:
              with open(merged,'wb') as f: writer.write(f)

          missing=[c for c in codes if c not in downloaded]
          with open(OUT+'/missing.txt','w',encoding='utf-8') as f: f.write('\n'.join(missing))
          with open(OUT+'/status.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['order','status','state','preorder','waybill','downloaded','error'])
              for c in codes:
                  o=states.get(c) or {}
                  w.writerow([c,o.get('status',''),o.get('state',''),o.get('preOrder',o.get('preorder','')),found.get(c,''),'yes' if c in downloaded else 'no',o.get('error','') or download_errors.get(c,'')])
          with open(OUT+'/result.json','w',encoding='utf-8') as f:
              json.dump({'codes':codes,'results':results,'states':states,'waybills':found,'download_errors':download_errors,'merge_errors':merge_errors,'missing':missing},f,ensure_ascii=False,indent=2)

          zipname=OUT+'/kaspi-waybills-20260919-batch1.zip'
          with zipfile.ZipFile(zipname,'w',zipfile.ZIP_DEFLATED) as z:
              if os.path.exists(merged): z.write(merged,os.path.basename(merged))
              z.write(OUT+'/missing.txt','missing.txt')
              z.write(OUT+'/status.csv','status.csv')
              z.write(OUT+'/result.json','result.json')
              for c in codes:
                  p=downloaded.get(c)
                  if p and os.path.exists(p): z.write(p,'waybills/'+os.path.basename(p))
          print(f'SUMMARY|total={len(codes)}|urls={len(found)}|pdfs={len(downloaded)}|missing={len(missing)}',flush=True)

      - name: Save results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/batch-2026-09-19-1/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Store Kaspi waybill batch 1 results 2026-09-19 [skip ci]"
            git push
          fi
