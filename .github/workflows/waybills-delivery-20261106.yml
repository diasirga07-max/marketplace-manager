name: "GRANTS BOOK: Deliver 24 waybills Nov 06"
on:
  push:
    branches:
      - ops/waybills-delivery-20261106
    paths:
      - .github/workflows/waybills-delivery-20261106.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PDF helpers
        run: python -m pip install --quiet pypdf requests
      - name: Get 24 official Kaspi PDFs and merge
        shell: python
        run: |
          import os, json, zipfile, concurrent.futures, requests
          from pypdf import PdfReader, PdfWriter
          from io import BytesIO
          codes='1138494273 1137259499 1127522911 1137900082 1137626109 1137578951 1137731638 1138472452 1138490103 1137990312 1137858660 1137757267 1137631475 1137578952 1137759300 1137274215 1137191973 1138408247 1137482739 1137892112 1138165977 1137672257 1125493308 1137529328'.split()
          os.makedirs('out/pdf',exist_ok=True)
          endpoint='https://grants-book-kaspi-assistant.vercel.app/api/accept-orders'
          def one(code):
            try:
              s=requests.get(endpoint,params={'code':code},timeout=35)
              s.raise_for_status()
              o=s.json().get('order') or {}
              url=o.get('waybill')
              if not url:
                return code,False,'Waybill not ready'
              r=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
              r.raise_for_status()
              if not r.content.startswith(b'%PDF'):
                return code,False,'Response not PDF'
              PdfReader(BytesIO(r.content))
              open('out/pdf/'+code+'.pdf','wb').write(r.content)
              return code,True,str(len(r.content))
            except Exception as e:
              return code,False,str(e)[:250]
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
            results=list(pool.map(one,codes))
          writer=PdfWriter()
          for code,ok,_ in results:
            if ok:
              reader=PdfReader('out/pdf/'+code+'.pdf')
              for page in reader.pages:writer.add_page(page)
          if len(writer.pages):
            with open('out/Kaspi_24_waybills_2026-11-06.pdf','wb') as f:writer.write(f)
          with open('out/status.json','w',encoding='utf-8') as f:json.dump(results,f,ensure_ascii=False,indent=2)
          with zipfile.ZipFile('out/Kaspi_waybills_2026-11-06.zip','w',zipfile.ZIP_DEFLATED) as z:
            for code,ok,_ in results:
              if ok:z.write('out/pdf/'+code+'.pdf', 'waybills/'+code+'.pdf')
          print('SUMMARY ready=',sum(ok for _,ok,_ in results),'of',len(codes),'pages=',len(writer.pages))
          print('FAILED CODES',[c for c,ok,_ in results if not ok])
      - name: Publish PDFs
        uses: actions/upload-artifact@v4
        with:
          name: kaspi-waybills-pdf-20261106
          path: out/
          if-no-files-found: error
          retention-days: 1
